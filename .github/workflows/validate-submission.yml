name: Validate submission
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
concurrency:
  group: validate-submission-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  validate:
    # The issue body is untrusted text. It is saved to a file by the script
    # below and only ever read by Python as data: it is never placed in a
    # shell command, and nothing from it is executed.
    if: contains(github.event.issue.labels.*.name, 'scale-submission') || startsWith(github.event.issue.title, '[Scale submission]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Save the issue body and apply the label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'issue-body.md'), issue.body || '');
            // The form applies this label only if it already exists, so create it on first use.
            const label = 'scale-submission';
            if (!issue.labels.some((item) => item.name === label)) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: label, color: '1d76db',
                    description: 'Scale submitted through the issue form',
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
            }
      - name: Extract the submission into a scale folder
        id: extract
        continue-on-error: true
        run: python -m tools.submission_intake --body-file "$RUNNER_TEMP/issue-body.md" --root . --report "$RUNNER_TEMP/report.txt"
      - name: Run the repository validator
        id: validate
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: python -m tools.validate --root . > "$RUNNER_TEMP/validate-out.txt" 2> "$RUNNER_TEMP/validate-err.txt"
      - name: Comment the result
        if: always() && steps.extract.outcome != 'skipped'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const read = (name) => {
              try { return fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), 'utf8'); } catch { return ''; }
            };
            // Validator messages can quote submitted text: show them as code, never as markup.
            const clean = (text) => text.replace(/`{3,}/g, "'''").trim().slice(0, 3000);
            const marker = '<!-- scale-submission-check -->';
            let text;
            if (process.env.EXTRACT_OUTCOME === 'success' && process.env.VALIDATE_OUTCOME === 'success') {
              const warnings = read('validate-out.txt').split('\n').filter((line) => line.startsWith('WARNING ')).join('\n');
              text = 'Passed the format checks; a reviewer will check permission and the measurements.';
              if (warnings) text += '\n\nThe validator also reported:\n\n```\n' + clean(warnings) + '\n```';
            } else {
              const problems = process.env.EXTRACT_OUTCOME === 'success' ? read('validate-err.txt') : read('report.txt');
              text = 'The submission did not pass the format checks:\n\n```\n'
                + clean(problems || 'The checks could not be completed.')
                + '\n```\n\nEdit the issue to correct this and the checks will run again.';
            }
            const body = `${marker}\n${text}`;
            const issue_number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find((item) => item.user.login === 'github-actions[bot]' && item.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
