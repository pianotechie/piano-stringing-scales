name: Publish catalog
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build validated release bundle
        run: python -m tools.release_bundle --root . --output build/release --revision "$SOURCE_REVISION"
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-release
          path: build/release/assets/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog-release
          path: build/release/assets/
      - name: Require tagged commit to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main || { echo 'Tagged commit is not on main.'; exit 1; }
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - name: Publish (a main dispatch only if this is still main)
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            current_revision=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$current_revision" != "$SOURCE_REVISION" ]; then
              echo 'Skipping superseded main revision.'
              exit 0
            fi
          fi
          python -m tools.publish_catalog --assets build/release/assets --revision "$SOURCE_REVISION"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
